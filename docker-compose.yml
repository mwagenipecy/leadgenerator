services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lead_generator_app
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
      - ./storage/framework:/var/www/html/storage/framework
      - public_assets:/var/www/html/public_shared
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_assets:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: lead_generator_app
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      - app
      - postgres
    networks:
      - app

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - app

volumes:
  postgres_data:
  public_assets:
  portainer_data:

networks:
  app:
    driver: bridge
