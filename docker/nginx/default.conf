server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/leadgenerator/public;
    index index.php index.html;

    charset utf-8;

    # Main route
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Favicon and robots.txt
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Laravel 404 handling
    error_page 404 /index.php;

    # PHP-FPM backend (Laravel app container)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass leadgenerator-app-1:9000;   # <- point to Laravel app container
        fastcgi_param SCRIPT_FILENAME /var/www/leadgenerator/public$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to hidden files except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Optional security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}