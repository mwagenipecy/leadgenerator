; Listen on TCP 9000 so nginx (in another container) can connect via leadgenerator-app-1:9000
[www]
user = www-data
group = www-data
listen = 9000
; allow all (omit listen.allowed_clients; "any" is invalid and causes "Connection disallowed")
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
