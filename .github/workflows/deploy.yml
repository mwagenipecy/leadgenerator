# CI/CD: Deploy to Azure server via SSH + Docker (no tests)
# This workflow runs on GitHub's servers - it cannot read files on your Mac.
# You MUST add the key in GitHub: Settings → Secrets and variables → Actions → New repository secret:
#   Name: DEPLOY_SSH_KEY
#   Value: run on your Mac:  cat config/fanikisha-app-_key.pem  (paste the entire output)
name: CI/CD Deploy

on:
  push:
    branches: [refined01]
  workflow_dispatch:

# Server connection (edit if different). Only DEPLOY_SSH_KEY is a secret.
env:
  DEPLOY_HOST: 20.164.19.2
  DEPLOY_USER: AdminFanikisha
  DEPLOY_PATH: /var/www/leadgenerator

jobs:
  deploy:
    name: Build and deploy on server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            echo "==> Switching to app directory..."
            cd "$DEPLOY_PATH"
            echo "==> Pulling latest code..."
            git fetch origin refined01
            git reset --hard origin/refined01
            echo "==> Auto-building Docker images on server..."
            docker compose build --no-cache app queue
            echo "==> Starting containers..."
            docker compose up -d
            echo "==> Running migrations and caches..."
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            echo "==> Deploy completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
