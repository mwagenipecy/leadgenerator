# CI/CD: Test, then deploy to Azure server via SSH + Docker
name: CI/CD Deploy

on:
  push:
    branches: [refined01]
  workflow_dispatch:

env:
  PHP_VERSION: '8.2'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Copy environment
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    name: Build and deploy on server
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/refined01'
    steps:
      - name: Auto build and deploy on server (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            echo "==> Switching to app directory..."
            cd "$DEPLOY_PATH"
            echo "==> Pulling latest code..."
            git fetch origin refined01
            git reset --hard origin/refined01
            echo "==> Auto-building Docker images on server..."
            docker compose build --no-cache app queue
            echo "==> Starting containers..."
            docker compose up -d
            echo "==> Running migrations and caches..."
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            echo "==> Deploy completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
