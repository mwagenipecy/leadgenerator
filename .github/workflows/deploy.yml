# CI/CD: Deploy to Azure server via SSH + Docker (no tests)
# SSH key: when adding DEPLOY_SSH_KEY from a .pem file, use: chmod 400 file.pem then paste its full content.
name: CI/CD Deploy

on:
  push:
    branches: [refined01]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy on server
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then echo "::error::DEPLOY_HOST is not set. Add it in Settings → Secrets and variables → Actions (e.g. 20.164.19.2)."; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then echo "::error::DEPLOY_USER is not set (e.g. AdminFanikisha)."; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then echo "::error::DEPLOY_SSH_KEY is not set. Paste the full .pem file content (chmod 400 the file locally, then cat file.pem)."; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then echo "::error::DEPLOY_PATH is not set (e.g. /var/www/lead_generator)."; exit 1; fi
          echo "All required secrets are set."

      - name: Auto build and deploy on server (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            echo "==> Switching to app directory..."
            cd "$DEPLOY_PATH"
            echo "==> Pulling latest code..."
            git fetch origin refined01
            git reset --hard origin/refined01
            echo "==> Auto-building Docker images on server..."
            docker compose build --no-cache app queue
            echo "==> Starting containers..."
            docker compose up -d
            echo "==> Running migrations and caches..."
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            echo "==> Deploy completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
